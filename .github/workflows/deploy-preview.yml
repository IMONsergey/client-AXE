name: Deploy AXE preview
# Dark source: feat/figma-concept-1 @ 274a260ca0730ed4ff312940a4af68918d02478c
# Light source: feat/figma-concept-light @ da70550d8b48e3897bd9afe005b15cd3dcfd4234
# Dark map source: feat/figma-concept-map-dark @ 826101616aa918cd56a887f7be3016e75f6a5b6c
# Light map source: feat/figma-concept-map-light @ 8145223238dd8f8380f1b9331ccc165a408e60d7
# Full dark prototype source: feat/full-dark-site @ 7137bf8e70c8605816f76782bd712cb7020e901e

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-preview.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current dark AXE concept
        uses: actions/checkout@v4
        with:
          ref: feat/figma-concept-1

      - name: Checkout light AXE concept
        uses: actions/checkout@v4
        with:
          ref: feat/figma-concept-light
          path: _light_source

      - name: Checkout dark map concept
        uses: actions/checkout@v4
        with:
          ref: feat/figma-concept-map-dark
          path: _map_dark_source

      - name: Checkout light map concept
        uses: actions/checkout@v4
        with:
          ref: feat/figma-concept-map-light
          path: _map_light_source

      - name: Checkout full dark prototype
        uses: actions/checkout@v4
        with:
          ref: feat/full-dark-site
          path: _full_dark_source

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          # Existing dark preview remains at the original URL.
          cp index.html _site/index.html
          cp -R assets _site/assets

          # Existing light preview remains isolated from dark assets.
          mkdir -p _site/light
          cp _light_source/index.html _site/light/index.html
          cp -R _light_source/assets _site/light/assets

          # Alternative dark version with the interactive countries map.
          mkdir -p _site/map-dark
          cp _map_dark_source/index.html _site/map-dark/index.html
          cp -R _map_dark_source/assets _site/map-dark/assets

          # Alternative light version with the interactive countries map.
          mkdir -p _site/map-light
          cp _map_light_source/index.html _site/map-light/index.html
          cp -R _map_light_source/assets _site/map-light/assets

          # Full dark-page prototype with sections 3–10.
          mkdir -p _site/full-dark
          cp _full_dark_source/index.html _site/full-dark/index.html
          cp -R _full_dark_source/assets _site/full-dark/assets

          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
