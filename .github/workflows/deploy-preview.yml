name: Deploy AXE preview
# Dark source: feat/figma-concept-1 @ 1b335cbeaf2c979308af051903433c4a4bcb93d8
# Light source: feat/figma-concept-light @ 6fdc3fceaa1132fc17b923163ea9d5777b37f5a3

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-preview.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current dark AXE concept
        uses: actions/checkout@v4
        with:
          ref: feat/figma-concept-1

      - name: Checkout light AXE concept
        uses: actions/checkout@v4
        with:
          ref: feat/figma-concept-light
          path: _light_source

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          # Existing dark preview remains at the original URL.
          cp index.html _site/index.html
          cp -R assets _site/assets

          # Separate light preview; all asset URLs are path-isolated from dark.
          mkdir -p _site/light
          cp _light_source/index.html _site/light/index.html
          cp -R _light_source/assets _site/light/assets

          # Cache-isolated light fallback for this exact build.
          LIGHT_ALT_PATH="light-fresh-6fdc3fce"
          mkdir -p "_site/${LIGHT_ALT_PATH}"
          cp _light_source/index.html "_site/${LIGHT_ALT_PATH}/index.html"
          cp -R _light_source/assets "_site/${LIGHT_ALT_PATH}/assets"

          # Cache-isolated dark fallback for this exact build.
          DARK_ALT_PATH="fresh-1b335cbe"
          mkdir -p "_site/${DARK_ALT_PATH}"
          cp index.html "_site/${DARK_ALT_PATH}/index.html"
          cp -R assets "_site/${DARK_ALT_PATH}/assets"

          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
