name: Deploy AXE preview
# Dark source: feat/figma-concept-1
# Light source: feat/figma-concept-light
# Dark map source: feat/figma-concept-map-dark
# Light map source: feat/figma-concept-map-light
# Full dark prototype source: feat/full-dark-site
# Structure candidate source: feat/structure-dark-map-v3 @ 5fdaab5568d530794cfb454f0ef83c935791054f

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-preview.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current dark AXE concept
        uses: actions/checkout@v4
        with:
          ref: feat/figma-concept-1

      - name: Checkout light AXE concept
        uses: actions/checkout@v4
        with:
          ref: feat/figma-concept-light
          path: _light_source

      - name: Checkout dark map concept
        uses: actions/checkout@v4
        with:
          ref: feat/figma-concept-map-dark
          path: _map_dark_source

      - name: Checkout light map concept
        uses: actions/checkout@v4
        with:
          ref: feat/figma-concept-map-light
          path: _map_light_source

      - name: Checkout full dark prototype
        uses: actions/checkout@v4
        with:
          ref: feat/full-dark-site
          path: _full_dark_source

      - name: Checkout document-aligned structure candidate
        uses: actions/checkout@v4
        with:
          ref: feat/structure-dark-map-v3
          path: _structure_dark_source

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          cp index.html _site/index.html
          cp -R assets _site/assets

          mkdir -p _site/light
          cp _light_source/index.html _site/light/index.html
          cp -R _light_source/assets _site/light/assets

          mkdir -p _site/map-dark
          cp _map_dark_source/index.html _site/map-dark/index.html
          cp -R _map_dark_source/assets _site/map-dark/assets

          mkdir -p _site/map-light
          cp _map_light_source/index.html _site/map-light/index.html
          cp -R _map_light_source/assets _site/map-light/assets

          mkdir -p _site/full-dark
          cp _full_dark_source/index.html _site/full-dark/index.html
          cp -R _full_dark_source/assets _site/full-dark/assets

          mkdir -p _site/structure-dark
          cp _structure_dark_source/index.html _site/structure-dark/index.html
          cp -R _structure_dark_source/assets _site/structure-dark/assets

          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Persist structure publish marker
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = 'qa/structure-dark-deploy-status.txt';
            const content = [
              'status=success',
              'structure_branch=feat/structure-dark-map-v3',
              'structure_head=5fdaab5568d530794cfb454f0ef83c935791054f',
              `workflow_sha=${context.sha}`,
              `page_url=${{ toJSON(steps.deployment.outputs.page_url) }}`
            ].join('\n') + '\n';
            let sha;
            try {
              const existing = await github.rest.repos.getContent({ owner, repo, path, ref: 'main' });
              if (!Array.isArray(existing.data)) sha = existing.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path,
              message: 'chore: record structure candidate Pages publish',
              content: Buffer.from(content).toString('base64'),
              sha,
              branch: 'main'
            });
