name: Deploy AXE preview
# Preview source: feat/figma-concept-1 @ 0a55408d92abb03031e4f85c40d75e7c5525b150

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-preview.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current AXE concept
        uses: actions/checkout@v4
        with:
          ref: feat/figma-concept-1

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          # Normal preview URL.
          cp index.html _site/index.html
          cp -R assets _site/assets

          # Cache-isolated fallback for this exact build.
          ALT_PATH="fresh-0a55408d"
          mkdir -p "_site/${ALT_PATH}"
          cp index.html "_site/${ALT_PATH}/index.html"
          cp -R assets "_site/${ALT_PATH}/assets"

          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4