# Temporary capture workflow: removed after the Figma vectors are persisted in the repository.
name: Capture Figma map vectors

on:
  push:
    branches:
      - feat/structure-dark-map-v3
    paths:
      - '.github/workflows/fetch-figma-map-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/structure-dark-map-v3

      - name: Download current Figma vector layers
        run: |
          set -euo pipefail
          out='assets/images/figma-v4/map'
          mkdir -p "$out"
          curl -fL --retry 3 -o "$out/neutral-land-silhouette.svg" 'https://www.figma.com/api/mcp/asset/e6751c0b-8ee2-449e-b580-d3093578e7a6.svg'
          curl -fL --retry 3 -o "$out/digital-dot-field.svg" 'https://www.figma.com/api/mcp/asset/e61d3a03-46a6-4a52-96ea-fb057018e7ba.svg'
          curl -fL --retry 3 -o "$out/digital-network-lines.svg" 'https://www.figma.com/api/mcp/asset/0920ce32-537b-49df-9f12-1294a9f3aec7.svg'
          curl -fL --retry 3 -o "$out/digital-network-nodes.svg" 'https://www.figma.com/api/mcp/asset/4fbe8efa-cb47-4a9c-909d-407daf41886e.svg'
          python3 - <<'PY'
          from pathlib import Path
          for path in Path('assets/images/figma-v4/map').glob('*.svg'):
              text = path.read_text(encoding='utf-8')
              assert '<svg' in text, path
              print(path, len(text))
          PY

      - name: Persist vector layers in the branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/images/figma-v4/map/*.svg
          if git diff --cached --quiet; then
            echo 'Figma map vectors are already current.'
            exit 0
          fi
          git commit -m 'chore: persist Figma map vectors'
          git push origin HEAD:feat/structure-dark-map-v3
