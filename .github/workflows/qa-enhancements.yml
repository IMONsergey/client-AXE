name: QA AXE enhancements

on:
  push:
    branches:
      - feat/figma-concept-1
    paths:
      - .github/workflows/qa-enhancements.yml
      - index.html
      - assets/css/enhancements.css
      - assets/css/motion.css
      - assets/js/navigation.js
      - assets/js/preloader.js
      - assets/js/motion.js
      - assets/js/dot-field.js
      - assets/js/globe.js
      - assets/images/direction-*.png

permissions:
  contents: read

jobs:
  qa-enhancements:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/figma-concept-1

      - name: Start static server
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/axe-http.log 2>&1 &
          sleep 2
          curl --fail --silent http://127.0.0.1:4173/ > /dev/null

      - name: Install Chromium
        shell: bash
        run: |
          npx --yes playwright@1.55.0 install --with-deps chromium
          npm install --no-save --no-package-lock playwright@1.55.0

      - name: Verify enhancements and capture renders
        shell: bash
        run: |
          node <<'EOF'
          const { chromium } = require('playwright');
          const url = 'http://127.0.0.1:4173/';

          const closeTo = (actual, expected, tolerance, label) => {
            if (Math.abs(actual - expected) > tolerance) {
              throw new Error(`${label}: expected ${expected.toFixed(2)}, got ${actual.toFixed(2)}`);
            }
          };

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            const errors = [];
            page.on('pageerror', error => errors.push(error.message));
            page.on('console', message => {
              if (message.type() === 'error') errors.push(message.text());
            });

            await page.goto(url, { waitUntil: 'networkidle' });
            await page.waitForFunction(() => window.__AXE_PRELOADER__?.getState().hidden === true, null, { timeout: 15000 });
            await page.waitForFunction(() => document.getElementById('site-preloader')?.hidden === true, null, { timeout: 16000 });
            await page.waitForFunction(() => window.__AXE_GLOBE__?.getState().ready === true);
            await page.waitForFunction(() => window.__AXE_MOTION__?.getState().ready === true, null, { timeout: 15000 });

            const desktop = await page.evaluate(() => {
              const rect = selector => document.querySelector(selector).getBoundingClientRect();
              const header = rect('.site-header__inner');
              const nav = rect('.site-nav');
              const rootHeader = document.querySelector('.site-header');
              const toggleStyle = getComputedStyle(document.querySelector('.menu-toggle'));
              const images = [...document.querySelectorAll('.direction-card__visual')];
              return {
                headerCenter: header.left + header.width / 2,
                navCenter: nav.left + nav.width / 2,
                toggleDisplay: toggleStyle.display,
                headerPosition: getComputedStyle(rootHeader).position,
                headerParent: rootHeader.parentElement?.className || '',
                headerScrolled: rootHeader.classList.contains('is-scrolled'),
                directionSources: images.map(image => image.getAttribute('src')),
                directionWidths: images.map(image => image.naturalWidth),
                directionCanvasCount: document.querySelectorAll('.direction-card canvas').length,
                motion: window.__AXE_MOTION__.getState()
              };
            });

            closeTo(desktop.navCenter, desktop.headerCenter, 2.5, 'desktop navigation center');
            if (desktop.toggleDisplay !== 'none') throw new Error(`desktop burger visible: ${desktop.toggleDisplay}`);
            if (desktop.headerPosition !== 'fixed' || desktop.headerScrolled) throw new Error(`header top state invalid ${JSON.stringify(desktop)}`);
            if (desktop.directionCanvasCount !== 0) throw new Error('direction cards still contain canvases');
            if (desktop.directionSources.join(',') !== 'assets/images/direction-links.png,assets/images/direction-pricing.png,assets/images/direction-platform.png') {
              throw new Error(`wrong direction artwork ${JSON.stringify(desktop.directionSources)}`);
            }
            if (desktop.directionWidths.some(width => width < 100)) throw new Error(`direction images failed to load ${JSON.stringify(desktop.directionWidths)}`);
            if (desktop.motion.revealTargets < 10 || desktop.motion.wordTargets < 4) throw new Error(`motion pool incomplete ${JSON.stringify(desktop.motion)}`);

            await page.evaluate(() => scrollTo(0, 820));
            await page.waitForTimeout(500);
            const scrolled = await page.evaluate(() => {
              const header = document.querySelector('.site-header');
              const rect = header.getBoundingClientRect();
              const state = window.__AXE_STICKY_HEADER__.getState();
              return {
                top: rect.top,
                position: getComputedStyle(header).position,
                classState: header.classList.contains('is-scrolled'),
                state
              };
            });
            closeTo(scrolled.top, 0, 1.5, 'fixed header top');
            if (scrolled.position !== 'fixed' || !scrolled.classState || !scrolled.state.scrolled || scrolled.state.inBody) {
              throw new Error(`header morph/reparent state invalid ${JSON.stringify(scrolled)}`);
            }
            await page.screenshot({ path: 'enhancement-scrolled-header-1440.png', fullPage: false });

            await page.locator('.directions').scrollIntoViewIfNeeded();
            await page.waitForTimeout(520);
            await page.locator('.directions').screenshot({ path: 'enhancement-directions.png' });

            await page.setViewportSize({ width: 390, height: 844 });
            await page.evaluate(() => scrollTo(0, 0));
            await page.waitForTimeout(220);

            const mobileClosed = await page.evaluate(() => {
              const toggle = document.querySelector('.menu-toggle');
              const request = document.querySelector('.header-request');
              const nav = document.querySelector('.site-nav');
              const toggleRect = toggle.getBoundingClientRect();
              const requestRect = request.getBoundingClientRect();
              return {
                toggleDisplay: getComputedStyle(toggle).display,
                state: window.__AXE_NAVIGATION__.getState(),
                toggleLeft: toggleRect.left,
                requestRight: requestRect.right,
                headerPosition: getComputedStyle(document.querySelector('.site-header')).position
              };
            });

            if (mobileClosed.toggleDisplay === 'none') throw new Error('mobile burger is hidden');
            if (mobileClosed.state.open || mobileClosed.state.expanded) throw new Error(`mobile menu starts open ${JSON.stringify(mobileClosed)}`);
            if (mobileClosed.toggleLeft <= mobileClosed.requestRight) throw new Error(`burger must sit to the right of CTA ${JSON.stringify(mobileClosed)}`);
            if (mobileClosed.headerPosition !== 'fixed') throw new Error('mobile header is not fixed');

            await page.locator('.menu-toggle').click();
            await page.waitForTimeout(320);

            const mobileOpen = await page.evaluate(() => {
              const toggle = document.querySelector('.menu-toggle');
              const nav = document.querySelector('.site-nav');
              const firstLink = nav.querySelector('a');
              const style = getComputedStyle(nav);
              const linkStyle = getComputedStyle(firstLink);
              const linkRect = firstLink.getBoundingClientRect();
              return {
                state: window.__AXE_NAVIGATION__.getState(),
                label: toggle.getAttribute('aria-label'),
                visibility: style.visibility,
                opacity: Number(style.opacity),
                position: style.position,
                textAlign: style.textAlign,
                alignItems: style.alignItems,
                linkJustify: linkStyle.justifyContent,
                linkRight: linkRect.right
              };
            });

            if (!mobileOpen.state.open || !mobileOpen.state.expanded) throw new Error(`burger did not open ${JSON.stringify(mobileOpen)}`);
            if (mobileOpen.label !== 'Закрыть меню') throw new Error(`burger label not synchronized: ${mobileOpen.label}`);
            if (mobileOpen.visibility !== 'visible' || mobileOpen.opacity < 0.9 || mobileOpen.position !== 'fixed') {
              throw new Error(`mobile menu presentation invalid ${JSON.stringify(mobileOpen)}`);
            }
            if (mobileOpen.textAlign !== 'right' || mobileOpen.alignItems !== 'flex-end' || mobileOpen.linkJustify !== 'flex-end') {
              throw new Error(`mobile menu is not right aligned ${JSON.stringify(mobileOpen)}`);
            }
            closeTo(mobileOpen.linkRight, 374, 3, 'mobile link right edge');

            await page.screenshot({ path: 'enhancement-mobile-menu-390.png' });
            await page.keyboard.press('Escape');
            await page.waitForTimeout(280);
            const mobileAfterEscape = await page.evaluate(() => window.__AXE_NAVIGATION__.getState());
            if (mobileAfterEscape.open || mobileAfterEscape.expanded) throw new Error('Escape did not close mobile menu');

            if (errors.length) throw new Error(errors.join('\n'));
            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          EOF

      - name: Upload enhancement renders
        uses: actions/upload-artifact@v4
        with:
          name: enhancement-visual-qa
          path: |
            enhancement-scrolled-header-1440.png
            enhancement-directions.png
            enhancement-mobile-menu-390.png
          if-no-files-found: error
          retention-days: 1
