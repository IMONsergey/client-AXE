name: QA current Figma structure

on:
  push:
    branches:
      - feat/structure-dark-map-v3
    paths-ignore:
      - 'qa/**'
      - 'design-qa.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: axe-current-figma-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Static invariants
        shell: python
        run: |
          from pathlib import Path

          html = Path('index.html').read_text(encoding='utf-8')
          css = Path('assets/css/figma-v4.css').read_text(encoding='utf-8')
          recovery = Path('assets/css/figma-v5-overrides.css').read_text(encoding='utf-8')
          js = Path('assets/js/figma-v4.js').read_text(encoding='utf-8')
          globe = Path('assets/js/globe.js').read_text(encoding='utf-8')
          trade = Path('trade-requests/trade-requests.js').read_text(encoding='utf-8')

          assert 'family=Inter' in html and 'family=Oswald' in html
          assert 'Трансграничная торговля в интересах наших участников. Товары. Мосты. Индикаторы.' in html
          assert 'Trade Requests' in html
          assert html.count('class="timeline-card"') == 6
          assert html.count('class="direction') >= 5
          assert html.count('class="quote-card"') == 3
          assert html.count('class="member-card"') == 8
          assert html.count('class="document-card"') == 3
          assert html.count('class="news-card"') == 3
          assert 'countries-map.png' in html
          assert 'figma-v5-overrides.css' in js
          assert 'countries__map--interactive' in recovery
          assert "calc((100% - 15px) / 2)" in recovery
          assert 'direction-featured-background.webp' in recovery
          assert 'metric-icon-goals.png' in js
          assert "for (const point of landPoints)" in globe
          assert 'context.stroke()' not in globe
          assert '__AXE_FIGMA_V4__' in js
          assert '__AXE_TRADE_REQUESTS__' in trade

      - name: Start local server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/axe-current.log 2>&1 &
          sleep 2
          curl --fail --silent http://127.0.0.1:4173/ >/dev/null

      - name: Install Chromium
        run: |
          npx --yes playwright@1.55.0 install --with-deps chromium
          npm install --no-save --no-package-lock playwright@1.55.0

      - name: Runtime, responsive and interaction QA
        run: |
          node <<'EOF'
          const { chromium } = require('playwright');
          const fs = require('fs');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            const errors = [];
            page.on('pageerror', e => errors.push(`pageerror: ${e.message}`));
            page.on('console', m => { if (m.type() === 'error') errors.push(`console: ${m.text()}`); });

            const waitMain = async () => {
              await page.waitForFunction(() => window.__AXE_GLOBE__?.getState().ready === true, null, { timeout: 16000 });
              await page.waitForFunction(() => window.__AXE_FIGMA_V4__?.getState().ready === true, null, { timeout: 8000 });
              await page.waitForFunction(() => document.querySelector('link[data-axe-recovery]')?.sheet, null, { timeout: 8000 });
              await page.evaluate(() => document.fonts?.ready);
              await page.waitForTimeout(350);
            };

            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded' });
            await waitMain();

            const desktop = await page.evaluate(() => {
              const rect = sel => document.querySelector(sel)?.getBoundingClientRect();
              const style = sel => getComputedStyle(document.querySelector(sel));
              const dirCards = [...document.querySelectorAll('.direction')].map(el => el.getBoundingClientRect());
              const timelineCards = [...document.querySelectorAll('.timeline-card')].slice(0, 3).map(el => el.getBoundingClientRect());
              const timelineViewport = rect('.timeline__viewport');
              const contacts = [...document.querySelectorAll('.contacts__grid > *')].map(el => el.getBoundingClientRect());
              return {
                scrollWidth: document.documentElement.scrollWidth,
                viewport: innerWidth,
                recovery: window.__AXE_FIGMA_V4__.getState(),
                bodyFont: style('body').fontFamily,
                titleFont: style('h1').fontFamily,
                header: rect('.site-header__inner'),
                headerPosition: style('.site-header').position,
                content: rect('.hero .container'),
                h1: rect('.hero h1'),
                subtitleFont: style('.hero__copy > p').fontFamily,
                subtitleSize: parseFloat(style('.hero__copy > p').fontSize),
                globe: rect('.hero__globe-shell'),
                exchangeBg: style('.metric--exchanges').backgroundColor,
                countryBg: style('.metric--countries').backgroundColor,
                goalColor: style('.goal p').color,
                goalsIcon: document.querySelector('.metric--link > img')?.getAttribute('src'),
                dirCards: dirCards.map(r => ({ left:r.left, right:r.right, top:r.top, bottom:r.bottom, width:r.width, height:r.height })),
                timelineViewport: { left:timelineViewport.left, right:timelineViewport.right, width:timelineViewport.width },
                timelineCards: timelineCards.map(r => ({ left:r.left, right:r.right, width:r.width })),
                mapSvg: Boolean(document.querySelector('svg.countries__map--interactive')),
                hotspots: document.querySelectorAll('.country-hotspot').length,
                eventControls: Boolean(document.querySelector('.events__controls')),
                eventNextDisabled: document.querySelector('[data-event-next]')?.disabled,
                footerBrand: Boolean(document.querySelector('.footer__brand')),
                contacts: contacts.map(r => ({ left:r.left, right:r.right, width:r.width }))
              };
            });

            if (desktop.scrollWidth > desktop.viewport + 2) throw new Error(`desktop horizontal overflow ${desktop.scrollWidth}/${desktop.viewport}`);
            if (!desktop.bodyFont.includes('Inter') || !desktop.titleFont.includes('Oswald')) throw new Error(`font system ${JSON.stringify({body:desktop.bodyFont,title:desktop.titleFont})}`);
            if (desktop.headerPosition !== 'fixed') throw new Error(`header position ${desktop.headerPosition}`);
            if (Math.abs(desktop.header.width - 1390) > 2) throw new Error(`header rail ${desktop.header.width}`);
            if (Math.abs(desktop.content.width - 1281) > 2) throw new Error(`content rail ${desktop.content.width}`);
            if (Math.abs(desktop.h1.width - 648) > 3) throw new Error(`hero heading width ${desktop.h1.width}`);
            if (!desktop.subtitleFont.includes('Inter') || Math.abs(desktop.subtitleSize - 20) > .75) throw new Error(`hero subtitle ${desktop.subtitleFont} ${desktop.subtitleSize}`);
            if (desktop.globe.width < 635 || desktop.globe.width > 645) throw new Error(`globe size ${desktop.globe.width}`);
            if (desktop.exchangeBg !== 'rgb(59, 127, 193)') throw new Error(`exchange metric color ${desktop.exchangeBg}`);
            if (desktop.countryBg !== 'rgb(0, 140, 154)') throw new Error(`country metric color ${desktop.countryBg}`);
            if (desktop.goalColor !== 'rgb(255, 255, 255)') throw new Error(`goal color ${desktop.goalColor}`);
            if (!desktop.goalsIcon?.includes('metric-icon-goals.png')) throw new Error(`goals icon ${desktop.goalsIcon}`);
            if (desktop.dirCards.length !== 5) throw new Error(`directions inventory ${desktop.dirCards.length}`);
            if (Math.abs(desktop.dirCards[0].width - 417) > 3 || Math.abs(desktop.dirCards[1].left - desktop.dirCards[0].right - 15) > 3) throw new Error(`directions grid ${JSON.stringify(desktop.dirCards.slice(0,2))}`);
            if (Math.abs(desktop.timelineCards[0].left - desktop.timelineViewport.left) > 3 || Math.abs(desktop.timelineCards[1].right - desktop.timelineViewport.right) > 3 || desktop.timelineCards[2].left < desktop.timelineViewport.right - 3) throw new Error(`timeline two-card layout ${JSON.stringify({viewport:desktop.timelineViewport,cards:desktop.timelineCards})}`);
            if (!desktop.mapSvg || desktop.hotspots !== 7) throw new Error(`interactive map ${JSON.stringify({svg:desktop.mapSvg,hotspots:desktop.hotspots})}`);
            if (!desktop.eventControls || desktop.recovery.eventCards !== 1 || desktop.eventNextDisabled !== true) throw new Error(`event shell ${JSON.stringify(desktop.recovery)}`);
            if (desktop.recovery.timelineCards !== 6 || desktop.recovery.quoteCards !== 3 || desktop.recovery.memberCards !== 8) throw new Error(`inventory ${JSON.stringify(desktop.recovery)}`);
            if (!desktop.footerBrand) throw new Error('footer brand missing');
            if (desktop.contacts.length === 2 && Math.abs(desktop.contacts[1].left - desktop.contacts[0].right - 20) > 2) throw new Error(`contacts gap ${JSON.stringify(desktop.contacts)}`);

            const globeBefore = await page.evaluate(() => window.__AXE_GLOBE__.getState().phi);
            const globeBox = await page.locator('#axe-globe').boundingBox();
            await page.mouse.move(globeBox.x + globeBox.width * .50, globeBox.y + globeBox.height * .50);
            await page.mouse.down();
            await page.mouse.move(globeBox.x + globeBox.width * .66, globeBox.y + globeBox.height * .45, { steps: 8 });
            await page.mouse.up();
            await page.waitForTimeout(240);
            const globeAfter = await page.evaluate(() => window.__AXE_GLOBE__.getState().phi);
            if (Math.abs(globeAfter - globeBefore) < .04) throw new Error(`globe drag inactive ${globeBefore} -> ${globeAfter}`);

            await page.evaluate(() => document.querySelector('#timeline').scrollIntoView({ behavior:'auto', block:'start' }));
            await page.waitForTimeout(200);
            await page.click('[data-timeline-next]');
            await page.waitForTimeout(650);
            const timelineIndex = await page.evaluate(() => window.__AXE_FIGMA_V4__.getState().timelineIndex);
            if (timelineIndex !== 1) throw new Error(`timeline index ${timelineIndex}`);

            await page.evaluate(() => document.querySelector('#leaders').scrollIntoView({ behavior:'auto', block:'start' }));
            await page.click('[data-quote-next]');
            await page.waitForTimeout(550);
            const quoteIndex = await page.evaluate(() => window.__AXE_FIGMA_V4__.getState().quoteIndex);
            if (quoteIndex !== 1) throw new Error(`quote index ${quoteIndex}`);

            await page.evaluate(() => document.querySelector('#countries').scrollIntoView({ behavior:'auto', block:'center' }));
            const rus = page.locator('.country-hotspot[data-country="RUS"]');
            await rus.focus();
            await page.waitForTimeout(120);
            const mapFocus = await page.evaluate(() => ({ active: window.__AXE_FIGMA_V4__.getState().map.activeCountry, tooltip: document.querySelector('.countries__map-tooltip')?.textContent, visible: document.querySelector('.countries__map-tooltip')?.classList.contains('is-visible') }));
            if (mapFocus.active !== 'RUS' || mapFocus.tooltip !== 'Россия' || !mapFocus.visible) throw new Error(`map focus ${JSON.stringify(mapFocus)}`);

            fs.mkdirSync('qa/current', { recursive: true });
            await page.screenshot({ path: 'qa/current/main-1440.png', fullPage: true });
            await page.locator('#timeline').screenshot({ path: 'qa/current/timeline-1440.png' });
            await page.locator('#countries').screenshot({ path: 'qa/current/map-1440.png' });

            await page.setViewportSize({ width: 390, height: 844 });
            await page.reload({ waitUntil: 'domcontentloaded' });
            await waitMain();
            const mobile = await page.evaluate(() => ({
              scrollWidth: document.documentElement.scrollWidth,
              viewport: innerWidth,
              menuDisplay: getComputedStyle(document.querySelector('.menu-toggle')).display,
              state: window.__AXE_FIGMA_V4__.getState(),
              mapSvg: Boolean(document.querySelector('svg.countries__map--interactive'))
            }));
            if (mobile.scrollWidth > mobile.viewport + 2) throw new Error(`mobile horizontal overflow ${mobile.scrollWidth}/${mobile.viewport}`);
            if (mobile.menuDisplay === 'none') throw new Error('mobile menu hidden');
            if (!mobile.mapSvg || mobile.state.map.countries !== 7) throw new Error(`mobile map ${JSON.stringify(mobile.state.map)}`);
            await page.click('[data-menu]');
            const opened = await page.evaluate(() => ({ open: document.body.classList.contains('nav-open'), expanded: document.querySelector('[data-menu]').getAttribute('aria-expanded') }));
            if (!opened.open || opened.expanded !== 'true') throw new Error(`mobile nav open ${JSON.stringify(opened)}`);
            await page.keyboard.press('Escape');
            const closed = await page.evaluate(() => ({ open: document.body.classList.contains('nav-open'), expanded: document.querySelector('[data-menu]').getAttribute('aria-expanded') }));
            if (closed.open || closed.expanded !== 'false') throw new Error(`mobile nav close ${JSON.stringify(closed)}`);
            await page.screenshot({ path: 'qa/current/main-390.png', fullPage: true });

            await page.setViewportSize({ width: 1440, height: 1000 });
            await page.goto('http://127.0.0.1:4173/trade-requests/', { waitUntil: 'domcontentloaded' });
            await page.waitForFunction(() => window.__AXE_TRADE_REQUESTS__?.getState().ready === true, null, { timeout: 5000 });
            if ((await page.locator('[data-auth-panel="login"]:visible').count()) !== 1) throw new Error('trade login not visible');
            await page.click('a[href="#register"]');
            if ((await page.locator('[data-auth-panel="register"]:visible').count()) !== 1) throw new Error('trade register switch failed');
            await page.click('a[href="#login"]');
            await page.fill('[data-login] input[type="email"]', 'qa@example.com');
            await page.fill('[data-login] input[type="password"]', 'test-password');
            await Promise.all([page.waitForURL('**/trade-requests/app.html'), page.click('[data-login] button[type="submit"]')]);
            const rowsBefore = await page.locator('[data-request]:visible').count();
            await page.fill('[data-filters] input[name="product"]', 'Соевые');
            await page.waitForTimeout(80);
            const rowsAfter = await page.locator('[data-request]:visible').count();
            if (rowsBefore !== 4 || rowsAfter !== 1) throw new Error(`trade filters ${rowsBefore} -> ${rowsAfter}`);
            await page.screenshot({ path: 'qa/current/trade-dashboard-1440.png', fullPage: true });
            await page.goto('http://127.0.0.1:4173/trade-requests/new.html', { waitUntil: 'domcontentloaded' });
            if ((await page.locator('[data-request-form]').count()) !== 1) throw new Error('trade new form missing');

            await page.setViewportSize({ width: 390, height: 844 });
            await page.goto('http://127.0.0.1:4173/trade-requests/app.html', { waitUntil: 'domcontentloaded' });
            const tradeMobile = await page.evaluate(() => ({ width:document.documentElement.scrollWidth, viewport:innerWidth }));
            if (tradeMobile.width > tradeMobile.viewport + 2) throw new Error(`trade mobile overflow ${JSON.stringify(tradeMobile)}`);
            await page.screenshot({ path: 'qa/current/trade-dashboard-390.png', fullPage: true });
            await page.goto('http://127.0.0.1:4173/trade-requests/new.html', { waitUntil: 'domcontentloaded' });
            const newMobile = await page.evaluate(() => ({ width:document.documentElement.scrollWidth, viewport:innerWidth }));
            if (newMobile.width > newMobile.viewport + 2) throw new Error(`trade new mobile overflow ${JSON.stringify(newMobile)}`);
            await page.screenshot({ path: 'qa/current/trade-new-390.png', fullPage: true });

            if (errors.length) throw new Error(errors.join('\n'));
            await browser.close();
          })().catch(async e => {
            console.error(e);
            process.exit(1);
          });
          EOF

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axe-current-figma-qa
          path: qa/current
          if-no-files-found: warn
          retention-days: 5
