name: QA ACE structure dark map v3

on:
  push:
    branches:
      - feat/structure-dark-map-v3
    paths:
      - index.html
      - assets/css/**
      - assets/images/figma/**
      - assets/js/**
      - .github/workflows/qa-structure-dark-v3.yml

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/structure-dark-map-v3

      - name: Static source invariants
        id: static
        continue-on-error: true
        shell: python
        run: |
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          css = Path('assets/css/structure-dark-v3.css').read_text(encoding='utf-8')
          js = Path('assets/js/structure-dark-v3.js').read_text(encoding='utf-8')
          globe = Path('assets/js/globe.js').read_text(encoding='utf-8')
          smooth = Path('assets/js/smooth-scroll.js').read_text(encoding='utf-8')
          assert 'family=Inter' in html and 'family=Oswald' in html
          assert 'Трансграничная торговля в интересах наших участников. Товары. Мосты. Индикаторы.' in html
          assert 'Создание виртуальной торговой платформы' in html
          assert html.count('class="timeline-item"') == 6
          assert html.count('class="direction-row') == 5
          assert html.count('class="quote-v3') == 5
          assert html.count('class="about-nav__icon"') == 3
          assert 'hero__continents-reference' not in html
          assert html.index('<header class="site-header">') < html.index('<main class="site-shell">')
          assert 'direction-featured-background.webp' in css
          assert '.timeline-v3__viewport' in css and 'overflow: visible' in css
          assert "for (const point of landPoints)" in globe
          assert 'WORLD_BOUNDARIES_URL' in globe and 'boundaryRings' in globe
          assert "globe-model.js?v=client-review-boundaries-2026-08-21" in globe
          assert not list(Path('.').glob('node-12-2-*'))
          for name in ('about-icon-directions.png', 'about-icon-timeline.png', 'about-icon-members.png', 'direction-featured-background.webp'):
            assert (Path('assets/images/figma') / name).is_file()
          assert 'Открыть Trade Requests' in html
          assert 'Ключевые события' in html
          assert '__AXE_STRUCTURE_V3__' in js
          assert 'font-family: "Oswald"' in css
          assert "addEventListener('wheel'" not in smooth

      - name: Start server
        id: server
        continue-on-error: true
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/ace-v3.log 2>&1 &
          sleep 2
          curl --fail --silent http://127.0.0.1:4173/ >/dev/null

      - name: Install Chromium
        id: chromium
        continue-on-error: true
        run: |
          npx --yes playwright@1.55.0 install --with-deps chromium
          npm install --no-save --no-package-lock playwright@1.55.0

      - name: Runtime interactions and responsive visual QA
        id: runtime
        continue-on-error: true
        run: |
          node <<'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            const errors = [];
            page.on('pageerror', e => errors.push(e.message));
            page.on('console', m => { if (m.type() === 'error') errors.push(m.text()); });
            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded' });
            await page.waitForFunction(() => window.__AXE_PRELOADER__?.getState().hidden === true, null, { timeout: 16000 });
            await page.waitForFunction(() => window.__AXE_GLOBE__?.getState().ready === true, null, { timeout: 16000 });
            await page.waitForFunction(() => window.__AXE_GLOBE__?.getState().boundariesReady === true, null, { timeout: 20000 });
            await page.waitForFunction(() => window.__AXE_STRUCTURE_V3__?.getState().ready === true, null, { timeout: 5000 });
            await page.waitForFunction(() => window.__AXE_COUNTRIES_MAP__?.getState().ready === true, null, { timeout: 20000 });
            await page.waitForTimeout(700);
            const desktop = await page.evaluate(() => ({
              width: document.documentElement.scrollWidth,
              viewport: innerWidth,
              structure: window.__AXE_STRUCTURE_V3__.getState(),
              globe: window.__AXE_GLOBE__.getState(),
              map: window.__AXE_COUNTRIES_MAP__.getState(),
              bodyFont: getComputedStyle(document.body).fontFamily,
              titleFont: getComputedStyle(document.querySelector('h1')).fontFamily,
              header: (() => { const el = document.querySelector('.site-header'); const rect = el.getBoundingClientRect(); return { parent: el.parentElement.tagName, position: getComputedStyle(el).position, top: rect.top, visible: rect.height > 0 && getComputedStyle(el).display !== 'none' }; })(),
              contentWidth: document.querySelector('.layout-container').getBoundingClientRect().width,
              iconCount: [...document.querySelectorAll('.about-nav__icon')].filter(img => img.complete && img.naturalWidth > 0).length,
              introBorder: getComputedStyle(document.querySelector('.about-v3__intro')).borderTopWidth,
              timelineOverflow: getComputedStyle(document.querySelector('.timeline-v3__viewport')).overflow,
              directionBackground: getComputedStyle(document.querySelector('.direction-row--featured')).backgroundImage,
              smooth: window.__AXE_SMOOTH_SCROLL__?.getState()
            }));
            if (desktop.width > desktop.viewport + 2) throw new Error(`desktop horizontal overflow ${JSON.stringify(desktop)}`);
            if (!desktop.bodyFont.includes('Inter') || !desktop.titleFont.includes('Oswald')) throw new Error(`font system ${JSON.stringify(desktop)}`);
            if (desktop.structure.tasks !== 6 || desktop.structure.directions !== 5 || desktop.structure.timeline !== 6 || desktop.structure.quotes !== 5 || desktop.structure.eventSlides !== 3) throw new Error(`structure inventory ${JSON.stringify(desktop.structure)}`);
            if (desktop.globe.renderer !== 'real-continent-blue-noise' || desktop.globe.samples < 2500 || desktop.globe.samples > 4000 || desktop.globe.boundaries < 150) throw new Error(`globe renderer ${JSON.stringify(desktop.globe)}`);
            if (desktop.map.loaded !== 7 || desktop.map.paths !== 7 || desktop.map.worldPaths < 10) throw new Error(`map inventory ${JSON.stringify(desktop.map)}`);
            if (desktop.smooth?.enabled || !desktop.smooth?.native) throw new Error(`non-native scroll ${JSON.stringify(desktop.smooth)}`);
            if (desktop.header.parent !== 'BODY' || desktop.header.position !== 'fixed' || !desktop.header.visible || Math.abs(desktop.header.top - 39) > 2) throw new Error(`header at top ${JSON.stringify(desktop.header)}`);
            if (desktop.contentWidth < 1338 || desktop.contentWidth > 1350) throw new Error(`content width ${desktop.contentWidth}`);
            if (desktop.iconCount !== 3 || desktop.introBorder !== '1px') throw new Error(`about nav details ${JSON.stringify(desktop)}`);
            if (desktop.timelineOverflow !== 'visible' || !desktop.directionBackground.includes('direction-featured-background')) throw new Error(`assets/layout ${JSON.stringify(desktop)}`);

            const globeBefore = await page.evaluate(() => window.__AXE_GLOBE__.getState().phi);
            const globeBox = await page.locator('#axe-globe').boundingBox();
            await page.mouse.move(globeBox.x + globeBox.width * .52, globeBox.y + globeBox.height * .5);
            await page.mouse.down();
            await page.mouse.move(globeBox.x + globeBox.width * .68, globeBox.y + globeBox.height * .44, { steps: 8 });
            await page.mouse.up();
            await page.waitForTimeout(260);
            const globeAfter = await page.evaluate(() => window.__AXE_GLOBE__.getState().phi);
            if (Math.abs(globeAfter - globeBefore) < .04) throw new Error(`globe drag inactive ${globeBefore} -> ${globeAfter}`);

            await page.evaluate(() => document.querySelector('#goal').scrollIntoView({ behavior:'auto', block:'start' }));
            await page.waitForTimeout(500);
            const headerGoal = await page.evaluate(() => { const el = document.querySelector('.site-header'); const rect = el.getBoundingClientRect(); return { top: rect.top, bottom: rect.bottom, scrolled: el.classList.contains('is-scrolled'), position: getComputedStyle(el).position, display: getComputedStyle(el).display }; });
            if (!headerGoal.scrolled || headerGoal.position !== 'fixed' || headerGoal.display === 'none' || Math.abs(headerGoal.top) > 2 || headerGoal.bottom < 60) throw new Error(`header at goal ${JSON.stringify(headerGoal)}`);

            await page.evaluate(() => document.querySelector('#timeline').scrollIntoView({ behavior:'auto', block:'start' }));
            await page.waitForTimeout(300);
            await page.click('[data-timeline-next]');
            await page.waitForTimeout(760);
            const timeline = await page.evaluate(() => { const viewport = document.querySelector('.timeline-v3__viewport').getBoundingClientRect(); const first = document.querySelector('.timeline-item').getBoundingClientRect(); return { index: window.__AXE_STRUCTURE_V3__.getState().timelineIndex, viewportLeft: viewport.left, firstLeft: first.left, firstRight: first.right }; });
            if (timeline.index !== 1 || timeline.firstLeft >= timeline.viewportLeft || timeline.firstRight >= timeline.viewportLeft) throw new Error(`timeline exit ${JSON.stringify(timeline)}`);

            await page.evaluate(() => scrollTo({ top: 0, behavior: 'auto' }));
            await page.waitForTimeout(650);
            const headerReturn = await page.evaluate(() => { const el = document.querySelector('.site-header'); return { top: el.getBoundingClientRect().top, scrolled: el.classList.contains('is-scrolled'), display: getComputedStyle(el).display }; });
            if (headerReturn.scrolled || headerReturn.display === 'none' || Math.abs(headerReturn.top - 39) > 2) throw new Error(`header return ${JSON.stringify(headerReturn)}`);

            await page.evaluate(() => document.querySelector('#events').scrollIntoView({ behavior:'auto', block:'start' }));
            await page.waitForTimeout(300);
            await page.click('[data-event-next]');
            await page.waitForTimeout(180);
            const eventIndex = await page.evaluate(() => window.__AXE_STRUCTURE_V3__.getState().eventIndex);
            if (eventIndex !== 1) throw new Error(`event slider did not advance ${eventIndex}`);
            await page.screenshot({ path: 'structure-dark-1440.png', fullPage: true });
            await page.locator('#about').screenshot({ path: 'structure-about-1440.png' });
            await page.locator('#members').screenshot({ path: 'structure-map-1440.png' });
            await page.locator('#events').screenshot({ path: 'structure-events-1440.png' });
            await page.setViewportSize({ width: 390, height: 844 });
            await page.reload({ waitUntil: 'domcontentloaded' });
            await page.waitForFunction(() => window.__AXE_PRELOADER__?.getState().hidden === true, null, { timeout: 16000 });
            await page.waitForFunction(() => window.__AXE_STRUCTURE_V3__?.getState().ready === true, null, { timeout: 5000 });
            await page.waitForFunction(() => window.__AXE_COUNTRIES_MAP__?.getState().ready === true, null, { timeout: 20000 });
            await page.waitForTimeout(500);
            const mobile = await page.evaluate(() => ({
              width: document.documentElement.scrollWidth,
              viewport: innerWidth,
              menu: getComputedStyle(document.querySelector('.menu-toggle')).display,
              structure: window.__AXE_STRUCTURE_V3__.getState(),
              map: window.__AXE_COUNTRIES_MAP__.getState()
            }));
            if (mobile.width > mobile.viewport + 2) throw new Error(`mobile horizontal overflow ${JSON.stringify(mobile)}`);
            if (mobile.menu === 'none') throw new Error('mobile menu hidden');
            if (mobile.structure.quotes !== 5 || mobile.map.loaded !== 7) throw new Error(`mobile inventory ${JSON.stringify(mobile)}`);
            await page.screenshot({ path: 'structure-dark-390.png', fullPage: true });
            if (errors.length) throw new Error(errors.join('\n'));
            await browser.close();
          })().catch(e => { console.error(e); process.exit(1); });
          EOF

      - name: Persist QA outcome and renders
        if: always()
        run: |
          mkdir -p qa/structure-dark-v3
          for pair in \
            'structure-dark-1440.png:desktop.png' \
            'structure-about-1440.png:about.png' \
            'structure-map-1440.png:map.png' \
            'structure-events-1440.png:events.png' \
            'structure-dark-390.png:mobile.png'; do
            src="${pair%%:*}"; dst="${pair##*:}"
            if [ -f "$src" ]; then cp "$src" "qa/structure-dark-v3/$dst"; fi
          done
          printf 'static=%s\nserver=%s\nchromium=%s\nruntime=%s\n' \
            '${{ steps.static.outcome }}' '${{ steps.server.outcome }}' '${{ steps.chromium.outcome }}' '${{ steps.runtime.outcome }}' \
            > qa/structure-dark-v3/status.txt
          if [ -f /tmp/ace-v3.log ]; then cp /tmp/ace-v3.log qa/structure-dark-v3/server.log; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/structure-dark-v3
          if ! git diff --cached --quiet; then
            git commit -m "chore: persist structure dark v3 QA"
            git push origin HEAD:feat/structure-dark-map-v3
          fi

      - name: Fail if QA did not pass
        if: always()
        run: |
          test '${{ steps.static.outcome }}' = success
          test '${{ steps.server.outcome }}' = success
          test '${{ steps.chromium.outcome }}' = success
          test '${{ steps.runtime.outcome }}' = success

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ace-structure-dark-map-v3-visual-qa
          path: qa/structure-dark-v3
          if-no-files-found: warn
          retention-days: 2
