name: QA AXE motion polish

on:
  push:
    branches:
      - feat/figma-concept-1
    paths:
      - .github/workflows/qa-motion-polish.yml
      - index.html
      - assets/css/motion-polish.css
      - assets/css/countries-grid-motion.css
      - assets/js/smooth-scroll.js
      - assets/js/globe.js
      - assets/js/countries-grid-motion.js
      - assets/js/motion.js
      - assets/js/navigation.js

permissions:
  contents: read

jobs:
  qa-motion-polish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/figma-concept-1

      - name: Validate polish invariants
        shell: python
        run: |
          from pathlib import Path

          html = Path('index.html').read_text(encoding='utf-8')
          polish = Path('assets/css/motion-polish.css').read_text(encoding='utf-8')
          countries = Path('assets/css/countries-grid-motion.css').read_text(encoding='utf-8')
          smooth = Path('assets/js/smooth-scroll.js').read_text(encoding='utf-8')
          globe = Path('assets/js/globe.js').read_text(encoding='utf-8')

          assert 'motion-polish.css' in html
          assert 'smooth-scroll.js' in html
          assert html.count('class="orbit__pulse-line ') == 2
          assert 'blur(8px)' in polish
          assert 'filter: blur(' not in polish.lower()
          assert 'background: #fff' in polish
          assert 'clip-path' in polish
          assert '660ms' in countries and '1840ms' in countries
          assert 'index * 125' in Path('assets/js/countries-grid-motion.js').read_text(encoding='utf-8')
          assert 'AUTO_SPEED = reducedMotion ? 0 : 0.067' in globe
          assert "addEventListener('wheel'" in smooth
          assert "{ passive: false }" in smooth

      - name: Start static server
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/axe-http.log 2>&1 &
          sleep 2
          curl --fail --silent http://127.0.0.1:4173/ > /dev/null

      - name: Install Chromium
        shell: bash
        run: |
          npx --yes playwright@1.55.0 install --with-deps chromium
          npm install --no-save --no-package-lock playwright@1.55.0

      - name: Verify runtime polish
        shell: bash
        run: |
          node <<'EOF'
          const { chromium } = require('playwright');
          const url = 'http://127.0.0.1:4173/';

          const rgbIsWhite = (value) => /rgb\(255, 255, 255\)/.test(value);

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            const errors = [];
            page.on('pageerror', error => errors.push(error.message));
            page.on('console', message => { if (message.type() === 'error') errors.push(message.text()); });

            await page.goto(url, { waitUntil: 'networkidle' });
            await page.waitForFunction(() => window.__AXE_PRELOADER__?.getState().hidden === true, null, { timeout: 15000 });
            await page.waitForFunction(() => window.__AXE_GLOBE__?.getState().ready === true, null, { timeout: 15000 });
            await page.waitForFunction(() => window.__AXE_MOTION__?.getState().ready === true, null, { timeout: 15000 });
            await page.waitForFunction(() => window.__AXE_SMOOTH_SCROLL__?.getState().ready === true);

            const base = await page.evaluate(() => {
              const headerButton = document.querySelector('.header-request');
              const heroButton = document.querySelector('.hero__request');
              const baseLines = [...document.querySelectorAll('.orbit__line')].map(line => getComputedStyle(line));
              const pulse = document.querySelector('.orbit__pulse-line');
              return {
                smooth: window.__AXE_SMOOTH_SCROLL__.getState(),
                autoSpeed: window.__AXE_GLOBE__.getState().autoSpeed,
                headerOpacity: getComputedStyle(headerButton).opacity,
                heroOpacity: getComputedStyle(heroButton).opacity,
                widths: baseLines.map(style => style.strokeWidth),
                caps: baseLines.map(style => style.strokeLinecap),
                pulseOffset: getComputedStyle(pulse).strokeDashoffset,
                pulseCount: document.querySelectorAll('.orbit__pulse-line').length
              };
            });

            if (!base.smooth.enabled) throw new Error(`smooth wheel disabled on desktop: ${JSON.stringify(base.smooth)}`);
            if (Math.abs(base.autoSpeed - 0.067) > 0.0001) throw new Error(`unexpected globe auto speed ${base.autoSpeed}`);
            if (base.headerOpacity !== '1' || base.heroOpacity !== '1') throw new Error('Trade Requests buttons are dimmed at rest');
            if (base.pulseCount !== 2) throw new Error(`expected 2 orbit pulses, got ${base.pulseCount}`);
            if (new Set(base.widths).size !== 1) throw new Error(`orbit base widths differ: ${base.widths}`);
            if (base.caps.some(cap => cap !== 'butt')) throw new Error(`orbit split caps are not seamless: ${base.caps}`);

            await page.waitForTimeout(420);
            const pulseAfter = await page.evaluate(() => getComputedStyle(document.querySelector('.orbit__pulse-line')).strokeDashoffset);
            if (pulseAfter === base.pulseOffset) throw new Error('orbit coordinate pulse is not moving');

            await page.hover('.header-request');
            await page.waitForTimeout(430);
            const headerHover = await page.evaluate(() => {
              const el = document.querySelector('.header-request');
              const s = getComputedStyle(el);
              return { bg: s.backgroundColor, color: s.color, opacity: s.opacity };
            });
            if (!rgbIsWhite(headerHover.bg) || headerHover.opacity !== '1') throw new Error(`header button hover invalid ${JSON.stringify(headerHover)}`);

            await page.hover('.hero__request');
            await page.waitForTimeout(430);
            const heroHover = await page.evaluate(() => {
              const el = document.querySelector('.hero__request');
              const s = getComputedStyle(el);
              return { bg: s.backgroundColor, color: s.color, opacity: s.opacity };
            });
            if (!rgbIsWhite(heroHover.bg) || heroHover.opacity !== '1') throw new Error(`hero button hover invalid ${JSON.stringify(heroHover)}`);

            await page.evaluate(() => scrollTo(0, 0));
            await page.mouse.move(900, 700);
            await page.mouse.wheel(0, 720);
            await page.waitForTimeout(120);
            const scrollEarly = await page.evaluate(() => ({ y: scrollY, state: window.__AXE_SMOOTH_SCROLL__.getState() }));
            await page.waitForTimeout(700);
            const scrollLate = await page.evaluate(() => ({ y: scrollY, state: window.__AXE_SMOOTH_SCROLL__.getState() }));
            if (scrollEarly.y <= 0 || scrollLate.y <= scrollEarly.y) throw new Error(`smooth scroll did not progress ${JSON.stringify({scrollEarly, scrollLate})}`);

            await page.waitForTimeout(700);
            const header = await page.evaluate(() => {
              const el = document.querySelector('.site-header');
              const style = getComputedStyle(el);
              return {
                fixed: style.position,
                scrolled: el.classList.contains('is-scrolled'),
                blur: style.backdropFilter || style.webkitBackdropFilter || ''
              };
            });
            if (header.fixed !== 'fixed' || !header.scrolled || !header.blur.includes('blur')) throw new Error(`header blur state invalid ${JSON.stringify(header)}`);

            await page.evaluate(() => document.querySelector('.directions').scrollIntoView({ block: 'center' }));
            await page.waitForFunction(() => document.querySelector('.direction-card')?.classList.contains('is-visible'));
            await page.waitForTimeout(260);
            const cardsDuring = await page.evaluate(() => {
              const card = document.querySelector('.direction-card');
              const body = card.querySelector('.direction-card__body');
              const visual = card.querySelector('.direction-card__visual');
              return {
                bodyClip: getComputedStyle(body).clipPath,
                visualClip: getComputedStyle(visual).clipPath,
                bodyDuration: getComputedStyle(body).transitionDuration,
                visualDuration: getComputedStyle(visual).transitionDuration
              };
            });
            if (!cardsDuring.bodyDuration.includes('1.18s') || !cardsDuring.visualDuration.includes('1.28s')) {
              throw new Error(`direction choreography timings missing ${JSON.stringify(cardsDuring)}`);
            }
            await page.locator('.directions').screenshot({ path: 'directions-motion.png' });

            await page.waitForTimeout(1500);
            const cardsFinal = await page.evaluate(() => {
              const card = document.querySelector('.direction-card');
              return {
                bodyClip: getComputedStyle(card.querySelector('.direction-card__body')).clipPath,
                visualClip: getComputedStyle(card.querySelector('.direction-card__visual')).clipPath,
                bodyOpacity: getComputedStyle(card.querySelector('.direction-card__body')).opacity,
                visualOpacity: getComputedStyle(card.querySelector('.direction-card__visual')).opacity
              };
            });
            if (cardsFinal.bodyOpacity !== '1' || cardsFinal.visualOpacity !== '1') throw new Error(`direction cards did not settle ${JSON.stringify(cardsFinal)}`);

            await page.evaluate(() => document.querySelector('.countries__grid').scrollIntoView({ block: 'center' }));
            await page.waitForFunction(() => window.__AXE_COUNTRIES_GRID__?.getState().started === true, null, { timeout: 5000 });
            const traceTiming = await page.evaluate(() => {
              const line = document.querySelector('.country__trace-line--top');
              return { duration: getComputedStyle(line).transitionDuration };
            });
            if (!traceTiming.duration.includes('0.66s')) throw new Error(`countries tracing still too fast ${JSON.stringify(traceTiming)}`);

            await page.locator('.hero__globe-shell').screenshot({ path: 'globe-orbit.png' });
            if (errors.length) throw new Error(errors.join('\n'));
            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          EOF

      - name: Upload motion renders
        uses: actions/upload-artifact@v4
        with:
          name: motion-polish-visual-qa
          path: |
            directions-motion.png
            globe-orbit.png
          if-no-files-found: error
          retention-days: 1
