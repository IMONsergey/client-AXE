name: QA AXE motion polish

on:
  push:
    branches: [feat/figma-concept-1]
    paths:
      - .github/workflows/qa-motion-polish.yml
      - index.html
      - assets/css/motion-polish.css
      - assets/css/countries-grid-motion.css
      - assets/js/smooth-scroll.js
      - assets/js/globe.js
      - assets/js/countries-grid-motion.js

permissions:
  contents: read

jobs:
  qa-motion-polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/figma-concept-1

      - name: Static invariants
        shell: python
        run: |
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          polish = Path('assets/css/motion-polish.css').read_text(encoding='utf-8')
          countries = Path('assets/css/countries-grid-motion.css').read_text(encoding='utf-8')
          smooth = Path('assets/js/smooth-scroll.js').read_text(encoding='utf-8')
          globe = Path('assets/js/globe.js').read_text(encoding='utf-8')
          country_js = Path('assets/js/countries-grid-motion.js').read_text(encoding='utf-8')

          assert 'motion-polish.css' in html
          assert 'smooth-scroll.js' in html
          assert html.count('class="orbit__pulse-line ') == 2
          assert 'backdrop-filter: blur(8px)' in polish
          assert '\n  filter: blur(' not in polish.lower()
          assert 'background: #fff' in polish
          assert 'clip-path' in polish
          assert '660ms' in countries and '1840ms' in countries
          assert 'index * 125' in country_js
          assert 'AUTO_SPEED = reducedMotion ? 0 : 0.067' in globe
          assert "addEventListener('wheel'" in smooth and '{ passive: false }' in smooth

      - name: Start server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/axe-http.log 2>&1 &
          sleep 2
          curl --fail --silent http://127.0.0.1:4173/ >/dev/null

      - name: Install Chromium
        run: |
          npx --yes playwright@1.55.0 install --with-deps chromium
          npm install --no-save --no-package-lock playwright@1.55.0

      - name: Runtime and visual QA
        run: |
          node <<'EOF'
          const { chromium } = require('playwright');
          const url = 'http://127.0.0.1:4173/';
          const white = v => /rgb\(255, 255, 255\)/.test(v);

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            const errors = [];
            page.on('pageerror', e => errors.push(e.message));
            page.on('console', m => { if (m.type() === 'error') errors.push(m.text()); });

            await page.goto(url, { waitUntil: 'networkidle' });
            await page.waitForFunction(() => window.__AXE_PRELOADER__?.getState().hidden === true, null, { timeout: 15000 });
            await page.waitForFunction(() => window.__AXE_GLOBE__?.getState().ready === true, null, { timeout: 15000 });
            await page.waitForFunction(() => window.__AXE_MOTION__?.getState().ready === true, null, { timeout: 15000 });
            await page.waitForFunction(() => window.__AXE_SMOOTH_SCROLL__?.getState().ready === true);

            const base = await page.evaluate(() => ({
              smooth: window.__AXE_SMOOTH_SCROLL__.getState(),
              globe: window.__AXE_GLOBE__.getState(),
              pulseCount: document.querySelectorAll('.orbit__pulse-line').length,
              pulseOffset: getComputedStyle(document.querySelector('.orbit__pulse-line')).strokeDashoffset,
              widths: [...document.querySelectorAll('.orbit__line')].map(x => getComputedStyle(x).strokeWidth),
              caps: [...document.querySelectorAll('.orbit__line')].map(x => getComputedStyle(x).strokeLinecap)
            }));
            if (!base.smooth.enabled) throw new Error(`smooth scrolling disabled: ${JSON.stringify(base.smooth)}`);
            if (Math.abs(base.globe.autoSpeed - .067) > .0001) throw new Error(`globe speed ${base.globe.autoSpeed}`);
            if (base.pulseCount !== 2 || new Set(base.widths).size !== 1 || base.caps.some(x => x !== 'butt')) throw new Error(`orbit base mismatch ${JSON.stringify(base)}`);

            await page.waitForTimeout(420);
            const pulse2 = await page.evaluate(() => getComputedStyle(document.querySelector('.orbit__pulse-line')).strokeDashoffset);
            if (pulse2 === base.pulseOffset) throw new Error('orbit pulse did not move');

            for (const selector of ['.header-request', '.hero__request']) {
              await page.hover(selector);
              await page.waitForTimeout(430);
              const style = await page.$eval(selector, el => {
                const s = getComputedStyle(el);
                return { bg: s.backgroundColor, color: s.color, opacity: s.opacity };
              });
              if (!white(style.bg) || style.opacity !== '1') throw new Error(`${selector} hover invalid ${JSON.stringify(style)}`);
            }

            await page.evaluate(() => scrollTo(0, 0));
            await page.mouse.move(900, 700);
            await page.mouse.wheel(0, 720);
            await page.waitForTimeout(120);
            const y1 = await page.evaluate(() => scrollY);
            await page.waitForTimeout(700);
            const y2 = await page.evaluate(() => scrollY);
            if (y1 <= 0 || y2 <= y1) throw new Error(`wheel smoothing did not progress ${y1} -> ${y2}`);

            await page.waitForTimeout(650);
            const header = await page.$eval('.site-header', el => {
              const s = getComputedStyle(el);
              return { position: s.position, scrolled: el.classList.contains('is-scrolled'), blur: s.backdropFilter || s.webkitBackdropFilter || '' };
            });
            if (header.position !== 'fixed' || !header.scrolled || !header.blur.includes('blur')) throw new Error(`header blur invalid ${JSON.stringify(header)}`);

            await page.evaluate(() => document.querySelector('.directions').scrollIntoView({ block: 'center' }));
            await page.waitForFunction(() => document.querySelector('.direction-card')?.classList.contains('is-visible'));
            await page.waitForTimeout(260);
            const card = await page.$eval('.direction-card', el => {
              const body = getComputedStyle(el.querySelector('.direction-card__body'));
              const visual = getComputedStyle(el.querySelector('.direction-card__visual'));
              return { bodyClip: body.clipPath, visualClip: visual.clipPath, bodyDur: body.transitionDuration, visualDur: visual.transitionDuration };
            });
            if (!card.bodyDur.includes('1.18s') || !card.visualDur.includes('1.28s')) throw new Error(`card choreography invalid ${JSON.stringify(card)}`);
            await page.locator('.directions').screenshot({ path: 'directions-motion.png' });

            await page.evaluate(() => document.querySelector('.countries__grid').scrollIntoView({ block: 'center' }));
            await page.waitForFunction(() => window.__AXE_COUNTRIES_GRID__?.getState().started === true, null, { timeout: 5000 });
            const countryDuration = await page.$eval('.country__trace-line--top', el => getComputedStyle(el).transitionDuration);
            if (!countryDuration.includes('.66s') && !countryDuration.includes('0.66s')) throw new Error(`country trace duration ${countryDuration}`);

            await page.evaluate(() => scrollTo(0, 0));
            await page.waitForTimeout(300);
            await page.locator('.hero__globe-shell').screenshot({ path: 'globe-orbit.png' });

            if (errors.length) throw new Error(errors.join('\n'));
            await browser.close();
          })().catch(e => { console.error(e); process.exit(1); });
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: motion-polish-visual-qa
          path: |
            directions-motion.png
            globe-orbit.png
          if-no-files-found: error
          retention-days: 1
