name: Localize Figma assets and fonts

on:
  push:
    branches:
      - feat/figma-concept-1
    paths:
      - .github/workflows/localize-figma-assets.yml

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/figma-concept-1

      - name: Download exact Figma assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/images

          fetch() {
            curl --fail --location --retry 3 --retry-delay 2 --silent --show-error "$1" --output "$2"
            test -s "$2"
          }

          fetch "https://www.figma.com/api/mcp/asset/dd75a561-2afe-4166-99d7-7ecb360e2638.svg" "assets/images/logo.svg"
          fetch "https://www.figma.com/api/mcp/asset/07ef8bc5-7634-47dc-97dc-907f6b9fafcd.png" "assets/images/arrow.png"
          fetch "https://www.figma.com/api/mcp/asset/61fc4ef5-72bc-4cfd-a819-312364bb9058.png" "assets/images/globe.png"
          fetch "https://www.figma.com/api/mcp/asset/4ddd1a21-283c-4e3d-b0d7-a9d1ca78bcfd.png" "assets/images/texture-top.png"
          fetch "https://www.figma.com/api/mcp/asset/98f6a082-a05f-47d6-bde5-762ae6bd4a2c.png" "assets/images/texture-middle.png"
          fetch "https://www.figma.com/api/mcp/asset/a9504fd5-374e-4c83-a61a-4c5e86bc18cd.svg" "assets/images/about-arrow.svg"
          fetch "https://www.figma.com/api/mcp/asset/1d9f7726-86fb-4d2c-85ee-7ea5ffc3f3b4.svg" "assets/images/document-icon.svg"
          fetch "https://www.figma.com/api/mcp/asset/8556a96d-7b9f-46c5-8702-347cbac7a427.svg" "assets/images/document-arrow.svg"
          fetch "https://www.figma.com/api/mcp/asset/d66e7e90-29ad-4f91-9e9e-177289b8ae0b.png" "assets/images/direction-links.png"
          fetch "https://www.figma.com/api/mcp/asset/228c5882-a256-496a-a079-9f7375d89587.png" "assets/images/direction-pricing.png"
          fetch "https://www.figma.com/api/mcp/asset/bfeb84e7-3efd-442a-89f9-bf0759d3830c.png" "assets/images/direction-platform.png"
          fetch "https://www.figma.com/api/mcp/asset/d526c884-f221-4f69-bcb9-7e8d49619f50.png" "assets/images/flag-russia.png"
          fetch "https://www.figma.com/api/mcp/asset/be673261-79cb-464a-a409-7d6e11aba910.png" "assets/images/flag-belarus.png"
          fetch "https://www.figma.com/api/mcp/asset/82bdf7e3-c578-46b8-a5a7-a625ad357c15.png" "assets/images/flag-kazakhstan.png"
          fetch "https://www.figma.com/api/mcp/asset/6724a658-53ee-466c-af08-a911e2e21a99.png" "assets/images/flag-uzbekistan.png"
          fetch "https://www.figma.com/api/mcp/asset/f0fc4b94-6fe5-472e-b93b-07a617f01f0d.png" "assets/images/flag-china.png"
          fetch "https://www.figma.com/api/mcp/asset/15e70cc1-985d-4f01-9728-0dc4226b8a1c.png" "assets/images/flag-iran.png"
          fetch "https://www.figma.com/api/mcp/asset/d313df42-cb4d-4188-82b0-b22890e6aa74.png" "assets/images/flag-egypt.png"

      - name: Download self-hosted fonts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/fonts
          BASE="https://raw.githubusercontent.com/fontsource/font-files/17d93df48cf49fa2e46a9009461f5565e4fced4e/fonts/google"

          fetch_font() {
            curl --fail --location --retry 3 --retry-delay 2 --silent --show-error "$1" --output "$2"
            test -s "$2"
          }

          fetch_font "$BASE/tiktok-sans/files/tiktok-sans-cyrillic-400-normal.woff2" "assets/fonts/tiktok-sans-cyrillic-400.woff2"
          fetch_font "$BASE/tiktok-sans/files/tiktok-sans-latin-400-normal.woff2" "assets/fonts/tiktok-sans-latin-400.woff2"
          fetch_font "$BASE/tiktok-sans/files/tiktok-sans-cyrillic-500-normal.woff2" "assets/fonts/tiktok-sans-cyrillic-500.woff2"
          fetch_font "$BASE/tiktok-sans/files/tiktok-sans-latin-500-normal.woff2" "assets/fonts/tiktok-sans-latin-500.woff2"
          fetch_font "$BASE/inter-tight/files/inter-tight-cyrillic-500-normal.woff2" "assets/fonts/inter-tight-cyrillic-500.woff2"
          fetch_font "$BASE/inter-tight/files/inter-tight-latin-500-normal.woff2" "assets/fonts/inter-tight-latin-500.woff2"

      - name: Replace temporary MCP URLs with local paths
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              "https://www.figma.com/api/mcp/asset/dd75a561-2afe-4166-99d7-7ecb360e2638.svg": "assets/images/logo.svg",
              "https://www.figma.com/api/mcp/asset/07ef8bc5-7634-47dc-97dc-907f6b9fafcd.png": "assets/images/arrow.png",
              "https://www.figma.com/api/mcp/asset/61fc4ef5-72bc-4cfd-a819-312364bb9058.png": "assets/images/globe.png",
              "https://www.figma.com/api/mcp/asset/a9504fd5-374e-4c83-a61a-4c5e86bc18cd.svg": "assets/images/about-arrow.svg",
              "https://www.figma.com/api/mcp/asset/1d9f7726-86fb-4d2c-85ee-7ea5ffc3f3b4.svg": "assets/images/document-icon.svg",
              "https://www.figma.com/api/mcp/asset/8556a96d-7b9f-46c5-8702-347cbac7a427.svg": "assets/images/document-arrow.svg",
              "https://www.figma.com/api/mcp/asset/d66e7e90-29ad-4f91-9e9e-177289b8ae0b.png": "assets/images/direction-links.png",
              "https://www.figma.com/api/mcp/asset/228c5882-a256-496a-a079-9f7375d89587.png": "assets/images/direction-pricing.png",
              "https://www.figma.com/api/mcp/asset/bfeb84e7-3efd-442a-89f9-bf0759d3830c.png": "assets/images/direction-platform.png",
              "https://www.figma.com/api/mcp/asset/d526c884-f221-4f69-bcb9-7e8d49619f50.png": "assets/images/flag-russia.png",
              "https://www.figma.com/api/mcp/asset/be673261-79cb-464a-a409-7d6e11aba910.png": "assets/images/flag-belarus.png",
              "https://www.figma.com/api/mcp/asset/82bdf7e3-c578-46b8-a5a7-a625ad357c15.png": "assets/images/flag-kazakhstan.png",
              "https://www.figma.com/api/mcp/asset/6724a658-53ee-466c-af08-a911e2e21a99.png": "assets/images/flag-uzbekistan.png",
              "https://www.figma.com/api/mcp/asset/f0fc4b94-6fe5-472e-b93b-07a617f01f0d.png": "assets/images/flag-china.png",
              "https://www.figma.com/api/mcp/asset/15e70cc1-985d-4f01-9728-0dc4226b8a1c.png": "assets/images/flag-iran.png",
              "https://www.figma.com/api/mcp/asset/d313df42-cb4d-4188-82b0-b22890e6aa74.png": "assets/images/flag-egypt.png",
          }

          html = Path("index.html")
          text = html.read_text(encoding="utf-8")
          for source, target in replacements.items():
              text = text.replace(source, target)
          html.write_text(text, encoding="utf-8")

          css = Path("assets/css/styles.css")
          text = css.read_text(encoding="utf-8")
          text = text.replace(
              "https://www.figma.com/api/mcp/asset/4ddd1a21-283c-4e3d-b0d7-a9d1ca78bcfd.png",
              "../images/texture-top.png",
          )
          text = text.replace(
              "https://www.figma.com/api/mcp/asset/98f6a082-a05f-47d6-bde5-762ae6bd4a2c.png",
              "../images/texture-middle.png",
          )
          css.write_text(text, encoding="utf-8")

      - name: Commit localized assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images assets/fonts index.html assets/css/styles.css
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: localize Figma assets and fonts"
          git push origin HEAD:feat/figma-concept-1
