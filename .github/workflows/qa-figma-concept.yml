name: QA AXE implementation
# QA source: live implementation; Figma is not part of this workflow.

on:
  push:
    branches:
      - feat/figma-concept-1
    paths:
      - .github/workflows/qa-figma-concept.yml
      - index.html
      - assets/css/**
      - assets/js/**
      - assets/vendor/**
      - assets/images/**

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/figma-concept-1

      - name: Validate implementation invariants
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')
          html = Path('index.html').read_text(encoding='utf-8')
          styles = Path('assets/css/styles.css').read_text(encoding='utf-8')
          refinements = Path('assets/css/refinements.css').read_text(encoding='utf-8')
          fonts = Path('assets/css/fonts.css').read_text(encoding='utf-8')
          globe = Path('assets/js/globe.js').read_text(encoding='utf-8')
          dots = Path('assets/js/dot-field.js').read_text(encoding='utf-8')
          typo = Path('assets/js/typograph.js').read_text(encoding='utf-8')
          combined = '\n'.join((html, styles, refinements, fonts, globe, dots, typo))

          for forbidden in ('www.figma.com/api/mcp/asset', 'fonts.googleapis.com', 'fonts.gstatic.com', 'assets/images/arrow.png'):
              assert forbidden not in combined, f'forbidden runtime dependency remains: {forbidden}'

          assert '<br' not in html.lower()
          assert html.count('visual-stage__dot-field') == 1
          assert 'visual-stage__texture' not in html
          assert html.count('hero__globe-orbits hero__globe-orbits--') == 2
          assert 'arcs: []' in globe
          assert 'pointerdown' in globe and 'pointermove' in globe
          assert 'ResizeObserver' in globe
          assert 'requestAnimationFrame' in dots and 'ResizeObserver' in dots
          assert 'prefers-reduced-motion: reduce' in dots
          assert 'pointer-events: none' in refinements

          match = re.search(r'const MAP_SAMPLES\s*=\s*([\d_]+)', globe)
          assert match, 'MAP_SAMPLES constant missing'
          assert int(match.group(1).replace('_', '')) <= 32767, 'COBE sample count exceeds shader-safe range'

          assert 'aspect-ratio: 1 / 1' in refinements
          assert '.metric-row:nth-child(1) { top: 0; bottom: 66.666666%; }' in refinements
          assert '.metric-row:nth-child(2) { top: 33.333333%; bottom: 33.333333%; }' in refinements
          assert '.metric-row:nth-child(3) { top: 66.666666%; bottom: 0; }' in refinements
          assert 'aspect-ratio: 2 / 1' in refinements
          assert '.document-card {\n    grid-column: 1;' in refinements

          refs = re.findall(r'(?:src|href)="(assets/[^"#?]+)"', html)
          refs += [f'assets/{p}' for p in re.findall(r'url\("\.\.\/([^"?]+)"\)', fonts)]
          refs += [f'assets/{p}' for p in re.findall(r'url\("\.\.\/([^"?]+)"\)', styles)]
          missing = sorted({ref for ref in refs if not (root / ref).exists()})
          assert not missing, f'missing local files: {missing}'

          assert html.count('class="country"') == 7
          assert html.count('class="direction-card"') == 3
          assert html.count('metric-card metric-card--') == 3
          assert Path('assets/vendor/cobe.js').exists()

      - name: Start static server
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/axe-http.log 2>&1 &
          sleep 2
          curl --fail --silent http://127.0.0.1:4173/ > /dev/null

      - name: Install browsers
        shell: bash
        run: |
          npx --yes playwright@1.55.0 install --with-deps chromium webkit
          npm install --no-save --no-package-lock playwright@1.55.0

      - name: Verify runtime and responsive geometry
        shell: bash
        run: |
          node <<'EOF'
          const { chromium, webkit } = require('playwright');
          const url = 'http://127.0.0.1:4173/';

          const closeTo = (actual, expected, tolerance, label) => {
            if (Math.abs(actual - expected) > tolerance) {
              throw new Error(`${label}: expected ${expected.toFixed(2)}, got ${actual.toFixed(2)}`);
            }
          };

          async function verifyMobile(page, engine) {
            await page.setViewportSize({ width: 390, height: 844 });
            await page.waitForTimeout(250);
            const boxes = await page.evaluate(() => {
              const box = (selector) => {
                const rect = document.querySelector(selector)?.getBoundingClientRect();
                return rect && { left: rect.left, top: rect.top, width: rect.width, height: rect.height, cx: rect.left + rect.width / 2, cy: rect.top + rect.height / 2 };
              };
              return {
                metrics: box('.metrics'),
                dark: box('.metric-card--dark'),
                teal: box('.metric-card--teal'),
                blue: box('.metric-card--blue'),
                about: box('.about-grid'),
                document: box('.document-card'),
                empty: box('.about-grid__cell:first-child')
              };
            });

            for (const [name, value] of Object.entries(boxes)) {
              if (!value) throw new Error(`${engine}: missing ${name}`);
            }

            const { metrics, dark, teal, blue, about, document, empty } = boxes;
            closeTo(metrics.height, metrics.width, 2.5, `${engine}: metrics square`);
            const w = metrics.width / 3;
            const h = metrics.height / 3;
            const expected = [
              ['8', dark, 1/6, 1/6],
              ['7', teal, 5/6, 1/2],
              ['~15', blue, 1/2, 5/6]
            ];
            for (const [label, card, xr, yr] of expected) {
              closeTo(card.width, w, 2.5, `${engine}: ${label} width`);
              closeTo(card.height, h, 2.5, `${engine}: ${label} height`);
              closeTo(card.cx, metrics.left + metrics.width * xr, 2.5, `${engine}: ${label} center-x`);
              closeTo(card.cy, metrics.top + metrics.height * yr, 2.5, `${engine}: ${label} center-y`);
            }

            closeTo(about.width, about.height * 2, 2.5, `${engine}: document area ratio`);
            closeTo(document.left, about.left, 2.5, `${engine}: document must be left`);
            closeTo(document.width, about.width / 2, 2.5, `${engine}: document width`);
            closeTo(document.height, about.height, 2.5, `${engine}: document height`);
            closeTo(empty.left, about.left + about.width / 2, 2.5, `${engine}: empty cell must be right`);
          }

          async function verifyChromium() {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            const errors = [];
            page.on('pageerror', e => errors.push(e.message));
            page.on('console', m => { if (m.type() === 'error') errors.push(m.text()); });
            await page.goto(url, { waitUntil: 'networkidle' });
            await page.waitForFunction(() => window.__AXE_DOT_FIELD__?.getState().ready === true);

            const initial = await page.evaluate(() => window.__AXE_DOT_FIELD__.getState());
            if (initial.dots < 100 || initial.dpr > 2.001) throw new Error(`bad dot state ${JSON.stringify(initial)}`);
            await page.waitForTimeout(420);
            const animated = await page.evaluate(() => window.__AXE_DOT_FIELD__.getState());
            if (animated.frame <= initial.frame) throw new Error('dot animation did not advance');
            const pe = await page.evaluate(() => getComputedStyle(document.querySelector('.visual-stage__dot-field')).pointerEvents);
            if (pe !== 'none') throw new Error(`dot canvas blocks pointers: ${pe}`);

            const globe = page.locator('#axe-globe');
            const r = await globe.boundingBox();
            if (!r) throw new Error('globe missing');
            const x = r.x + r.width * .54, y = r.y + r.height * .52;
            const hit = await page.evaluate(({x,y}) => document.elementFromPoint(x,y)?.id || '', {x,y});
            if (hit !== 'axe-globe') throw new Error(`globe pointer blocked by ${hit}`);
            await page.mouse.move(x, y);
            await page.mouse.down();
            await page.mouse.move(x + 58, y + 24, { steps: 6 });
            await page.mouse.up();
            await page.waitForTimeout(180);
            const interactive = await page.evaluate(() => window.__AXE_DOT_FIELD__.getState());
            if (interactive.pointerStrength <= .01) throw new Error('dot hover influence inactive');

            await verifyMobile(page, 'Chromium');
            if (errors.length) throw new Error(errors.join('\n'));

            const reduced = await browser.newContext({ viewport: { width: 390, height: 844 }, reducedMotion: 'reduce' });
            const reducedPage = await reduced.newPage();
            await reducedPage.goto(url, { waitUntil: 'networkidle' });
            await reducedPage.waitForFunction(() => window.__AXE_DOT_FIELD__?.getState().ready === true);
            if (!(await reducedPage.evaluate(() => window.__AXE_DOT_FIELD__.getState().reducedMotion))) throw new Error('reduced motion not respected');
            await reduced.close();
            await browser.close();
          }

          async function verifyWebKit() {
            const browser = await webkit.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            const errors = [];
            page.on('pageerror', e => errors.push(e.message));
            page.on('console', m => { if (m.type() === 'error') errors.push(m.text()); });
            await page.goto(url, { waitUntil: 'networkidle' });
            await page.waitForFunction(() => window.__AXE_DOT_FIELD__?.getState().ready === true);

            const globe = page.locator('#axe-globe');
            const r = await globe.boundingBox();
            if (!r) throw new Error('WebKit: globe missing');
            const sy = r.y + r.height * .52;
            for (let i = 0; i < 4; i++) {
              await page.mouse.move(r.x + r.width * .66, sy);
              await page.mouse.down();
              await page.mouse.move(r.x + r.width * .16, sy, { steps: 10 });
              await page.mouse.up();
              await page.waitForTimeout(130);
            }
            await page.locator('.hero__visual').screenshot({ path: 'preview-webkit-globe-rotated.png' });
            await verifyMobile(page, 'WebKit');
            await page.screenshot({ path: 'preview-390-webkit.png', fullPage: true });
            if (errors.length) throw new Error(errors.join('\n'));
            await browser.close();
          }

          (async () => {
            await verifyChromium();
            await verifyWebKit();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          EOF

      - name: Capture responsive Chromium renders
        shell: bash
        run: |
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="1440,1000" --full-page http://127.0.0.1:4173/ preview-1440.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="1024,900" --full-page http://127.0.0.1:4173/ preview-1024.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="768,900" --full-page http://127.0.0.1:4173/ preview-768.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="390,844" --full-page http://127.0.0.1:4173/ preview-390.png
          test -s preview-1440.png
          test -s preview-1024.png
          test -s preview-768.png
          test -s preview-390.png
          test -s preview-390-webkit.png
          test -s preview-webkit-globe-rotated.png

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa
          path: |
            preview-1440.png
            preview-1024.png
            preview-768.png
            preview-390.png
            preview-390-webkit.png
            preview-webkit-globe-rotated.png
          if-no-files-found: error
          retention-days: 1
