name: QA AXE implementation

on:
  push:
    branches:
      - feat/figma-concept-1

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/figma-concept-1

      - name: Start static server
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/axe-http.log 2>&1 &
          sleep 2

      - name: Install Chromium
        shell: bash
        run: |
          npx --yes playwright@1.55.0 install --with-deps chromium
          npm install --no-save --no-package-lock playwright@1.55.0

      - name: Dump mobile metric geometry
        shell: bash
        run: |
          node <<'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
            const debug = await page.evaluate(() => {
              const inspect = (selector) => {
                const el = document.querySelector(selector);
                const cs = getComputedStyle(el);
                const r = el.getBoundingClientRect();
                return {
                  selector,
                  rect: { left:r.left, top:r.top, width:r.width, height:r.height },
                  offsetParent: el.offsetParent?.className || el.offsetParent?.tagName || null,
                  position: cs.position,
                  display: cs.display,
                  boxSizing: cs.boxSizing,
                  width: cs.width,
                  height: cs.height,
                  minHeight: cs.minHeight,
                  maxHeight: cs.maxHeight,
                  top: cs.top,
                  bottom: cs.bottom,
                  left: cs.left,
                  right: cs.right,
                  paddingTop: cs.paddingTop,
                  paddingBottom: cs.paddingBottom,
                  gridRow: cs.gridRow,
                  gridColumn: cs.gridColumn,
                  alignSelf: cs.alignSelf,
                  overflow: cs.overflow
                };
              };
              return [
                inspect('.metrics'),
                inspect('.metric-row:nth-child(1)'),
                inspect('.metric-card--dark'),
                inspect('.metric-row:nth-child(2)'),
                inspect('.metric-card--teal'),
                inspect('.metric-row:nth-child(3)'),
                inspect('.metric-card--blue')
              ];
            });
            console.log(JSON.stringify(debug, null, 2));
            await page.screenshot({ path: 'debug-mobile.png', fullPage: true });
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: debug-mobile
          path: debug-mobile.png
          retention-days: 1
