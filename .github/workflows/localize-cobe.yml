name: Vendor COBE runtime

on:
  push:
    branches:
      - feat/figma-concept-1
    paths:
      - .github/workflows/localize-cobe.yml

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/figma-concept-1

      - name: Install COBE package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cobe-package assets/vendor
          cd /tmp/cobe-package
          npm pack cobe@2.0.1 --silent > /tmp/cobe-tarball-name.txt
          tar -xzf "$(cat /tmp/cobe-tarball-name.txt)"
          cp package/dist/index.esm.js "$GITHUB_WORKSPACE/assets/vendor/cobe.js"
          test -s "$GITHUB_WORKSPACE/assets/vendor/cobe.js"

      - name: Commit vendored runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/vendor/cobe.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: vendor cobe 2.0.1"
          git push origin HEAD:feat/figma-concept-1
