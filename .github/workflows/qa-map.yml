name: QA AXE interactive map

on:
  push:
    branches:
      - feat/figma-concept-map-dark
      - feat/figma-concept-map-light
    paths:
      - index.html
      - assets/css/**
      - assets/js/**
      - .github/workflows/qa-map.yml

permissions:
  contents: read

jobs:
  qa-map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Static map invariants
        shell: python
        run: |
          from pathlib import Path
          js = Path('assets/js/countries-grid-motion.js').read_text(encoding='utf-8')
          css = Path('assets/css/countries-grid-motion.css').read_text(encoding='utf-8')
          smooth = Path('assets/js/smooth-scroll.js').read_text(encoding='utf-8')
          assert "addEventListener('wheel'" not in smooth
          assert 'enabled: false' in smooth and 'native: true' in smooth
          assert '__AXE_COUNTRIES_MAP__' in js
          assert 'countries.geo.json' in js
          assert 'const MIN_LON = 5' in js and 'const MAX_LON = 180' in js
          assert 'const MIN_LAT = 15' in js and 'const MAX_LAT = 82' in js
          assert "color: '#3b7fc1'" in js and "color: '#b6435c'" in js
          assert 'countries__head' in js
          assert 'members-map__meta' not in js
          assert 'UA_43_Avtonomna_Respublika_Krym.geojson' in js
          assert 'UA_14_Donetska.geojson' in js
          assert 'UA_09_Luhanska.geojson' in js
          assert 'UA_23_Zaporizka.geojson' in js
          assert 'UA_65_Khersonska.geojson' in js
          assert 'members-map__land' in js
          assert 'members-map__flag' in js
          assert 'background: none !important' in css
          assert 'border: 0 !important' in css
          assert 'stroke-linejoin: round' in css
          assert 'opacity: 1 !important' in css
          assert 'flex: 1 1 50%' in css
          assert 'margin-top: -1px !important' in css
          assert 'about-grid.motion-reveal' in css

      - name: Start server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/axe-map-http.log 2>&1 &
          sleep 2
          curl --fail --silent http://127.0.0.1:4173/ >/dev/null

      - name: Install Chromium
        run: |
          npx --yes playwright@1.55.0 install --with-deps chromium
          npm install --no-save --no-package-lock playwright@1.55.0

      - name: Verify focused map runtime and geometry
        run: |
          node <<'EOF'
          const { chromium } = require('playwright');
          const closeTo = (a,b,t,label) => { if (Math.abs(a-b) > t) throw new Error(`${label}: ${a} vs ${b}`); };
          (async () => {
            const browser = await chromium.launch({ headless:true });
            const page = await browser.newPage({ viewport:{ width:1440, height:1000 } });
            const errors = [];
            page.on('pageerror', e => errors.push(e.message));
            page.on('console', m => { if (m.type() === 'error') errors.push(m.text()); });
            await page.goto('http://127.0.0.1:4173/', { waitUntil:'networkidle' });
            await page.waitForFunction(() => window.__AXE_PRELOADER__?.getState().hidden === true, null, { timeout:15000 });
            await page.waitForFunction(() => window.__AXE_MOTION__?.getState().ready === true, null, { timeout:15000 });
            await page.waitForFunction(() => window.__AXE_COUNTRIES_MAP__?.getState().ready === true, null, { timeout:25000 });

            const scrollState = await page.evaluate(() => window.__AXE_SMOOTH_SCROLL__?.getState());
            if (!scrollState?.native || scrollState.enabled || scrollState.running) throw new Error(`custom scroll active ${JSON.stringify(scrollState)}`);

            await page.evaluate(() => document.querySelector('.about')?.scrollIntoView({ behavior:'auto', block:'center' }));
            await page.waitForTimeout(1200);
            const stitch = await page.evaluate(() => {
              const metrics = document.querySelector('.metrics').getBoundingClientRect();
              const aboutGrid = document.querySelector('.about-grid').getBoundingClientRect();
              return { metricsBottom:metrics.bottom, aboutTop:aboutGrid.top, transform:getComputedStyle(document.querySelector('.about-grid')).transform };
            });
            closeTo(stitch.aboutTop, stitch.metricsBottom, 2.2, 'metrics/about stitch');
            if (stitch.transform !== 'none') throw new Error(`about grid transform ${stitch.transform}`);

            await page.evaluate(() => document.querySelector('.members-map')?.scrollIntoView({ behavior:'auto', block:'center' }));
            await page.waitForFunction(() => window.__AXE_COUNTRIES_MAP__?.getState().started === true, null, { timeout:5000 });
            await page.waitForTimeout(1100);
            const state = await page.evaluate(() => {
              const head = document.querySelector('.countries__head').getBoundingClientRect();
              const title = document.querySelector('.countries__head #countries-title').getBoundingClientRect();
              const legend = document.querySelector('.countries__head .members-map__legend').getBoundingClientRect();
              const firstLegend = getComputedStyle(document.querySelector('.members-map__legend-item'));
              const selected = getComputedStyle(document.querySelector('.members-map__country'));
              return {
                map: window.__AXE_COUNTRIES_MAP__.getState(),
                legends: document.querySelectorAll('.members-map__legend-item').length,
                flags: document.querySelectorAll('.members-map__flag').length,
                selected: document.querySelectorAll('.members-map__country').length,
                world: document.querySelectorAll('.members-map__land').length,
                bg: getComputedStyle(document.querySelector('.members-map')).backgroundImage,
                border: getComputedStyle(document.querySelector('.members-map')).borderTopWidth,
                headWidth: head.width,
                titleWidth: title.width,
                legendWidth: legend.width,
                legendOpacity: Number(firstLegend.opacity),
                selectedStroke: parseFloat(selected.strokeWidth),
                selectedJoin: selected.strokeLinejoin
              };
            });
            if (state.map.countries !== 7 || state.legends !== 7 || state.flags !== 7 || state.selected !== 7) throw new Error(`map inventory ${JSON.stringify(state)}`);
            if (state.world < 25 || state.world > 110) throw new Error(`regional world inventory ${state.world}`);
            if (!state.map.rfOverrideLoaded) throw new Error('RF jurisdiction override did not load');
            if (JSON.stringify(state.map.viewport) !== JSON.stringify({minLon:5,maxLon:180,minLat:15,maxLat:82})) throw new Error(`wrong map viewport ${JSON.stringify(state.map.viewport)}`);
            if (state.bg !== 'none' || state.border !== '0px') throw new Error(`map still has panel ${JSON.stringify(state)}`);
            if (state.legendOpacity !== 1) throw new Error(`legend is translucent ${state.legendOpacity}`);
            if (state.selectedStroke > .9 || state.selectedJoin !== 'round') throw new Error(`country outline too hard ${JSON.stringify(state)}`);
            closeTo(state.titleWidth, state.legendWidth, 8, 'desktop 50/50 title-list split');

            await page.hover('.members-map__legend-item[data-code="CHN"]');
            await page.waitForTimeout(220);
            const active = await page.evaluate(() => ({
              state: window.__AXE_COUNTRIES_MAP__.getState(),
              activePaths: document.querySelectorAll('.members-map__country.is-active').length,
              legendOpacities: [...document.querySelectorAll('.members-map__legend-item')].map(el => Number(getComputedStyle(el).opacity))
            }));
            if (active.state.activeCode !== 'CHN' || active.activePaths !== 1) throw new Error(`map interaction ${JSON.stringify(active)}`);
            if (active.legendOpacities.some(value => value !== 1)) throw new Error(`legend dimmed on interaction ${JSON.stringify(active.legendOpacities)}`);
            await page.locator('.countries').screenshot({ path:'map-1440.png' });

            await page.setViewportSize({ width:390, height:844 });
            await page.reload({ waitUntil:'networkidle' });
            await page.waitForFunction(() => window.__AXE_PRELOADER__?.getState().hidden === true, null, { timeout:15000 });
            await page.waitForFunction(() => window.__AXE_COUNTRIES_MAP__?.getState().ready === true, null, { timeout:25000 });
            await page.evaluate(() => document.querySelector('.members-map')?.scrollIntoView({ behavior:'auto', block:'center' }));
            await page.waitForTimeout(900);
            const mobile = await page.evaluate(() => ({
              width: document.querySelector('.members-map').getBoundingClientRect().width,
              selected: document.querySelectorAll('.members-map__country').length,
              flags: document.querySelectorAll('.members-map__flag').length,
              headDisplay: getComputedStyle(document.querySelector('.countries__head')).display,
              legendOpacities: [...document.querySelectorAll('.members-map__legend-item')].map(el => Number(getComputedStyle(el).opacity))
            }));
            if (mobile.selected !== 7 || mobile.flags !== 7 || mobile.width > 390) throw new Error(`mobile map ${JSON.stringify(mobile)}`);
            if (mobile.headDisplay !== 'block') throw new Error(`mobile countries head should stack ${JSON.stringify(mobile)}`);
            if (mobile.legendOpacities.some(value => value !== 1)) throw new Error('mobile legend is translucent');
            await page.locator('.countries').screenshot({ path:'map-390.png' });

            if (errors.length) throw new Error(errors.join('\n'));
            await browser.close();
          })().catch(e => { console.error(e); process.exit(1); });
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: axe-map-visual-qa
          path: |
            map-1440.png
            map-390.png
          if-no-files-found: error
          retention-days: 1
