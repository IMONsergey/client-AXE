name: QA structure dark candidate PR

on:
  pull_request:
    branches: [main]
    paths:
      - index.html
      - assets/css/**
      - assets/js/**

permissions:
  contents: read

jobs:
  qa:
    if: github.head_ref == 'feat/structure-dark-map-v3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Start server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/ace-v3.log 2>&1 &
          sleep 2
          curl --fail --silent http://127.0.0.1:4173/ >/dev/null

      - name: Install Chromium
        run: |
          npx --yes playwright@1.55.0 install --with-deps chromium
          npm install --no-save --no-package-lock playwright@1.55.0

      - name: Runtime and visual QA
        run: |
          node <<'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless:true });
            const page = await browser.newPage({ viewport:{width:1440,height:1000} });
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>window.__AXE_PRELOADER__?.getState().hidden===true,null,{timeout:16000});
            await page.waitForFunction(()=>window.__AXE_GLOBE__?.getState().ready===true,null,{timeout:16000});
            await page.waitForFunction(()=>window.__AXE_STRUCTURE_V3__?.getState().ready===true,null,{timeout:5000});
            await page.waitForFunction(()=>window.__AXE_COUNTRIES_MAP__?.getState().ready===true,null,{timeout:20000});
            await page.waitForTimeout(700);
            const desktop=await page.evaluate(()=>({
              sw:document.documentElement.scrollWidth,vw:innerWidth,
              structure:window.__AXE_STRUCTURE_V3__.getState(),
              globe:window.__AXE_GLOBE__.getState(),
              map:window.__AXE_COUNTRIES_MAP__.getState(),
              bodyFont:getComputedStyle(document.body).fontFamily,
              titleFont:getComputedStyle(document.querySelector('h1')).fontFamily,
              orbitCount:document.querySelectorAll('.hero__globe-orbits').length,
              nav:[...document.querySelectorAll('.site-nav a')].map(a=>a.getAttribute('href'))
            }));
            if(desktop.sw>desktop.vw+2) throw new Error('desktop overflow '+JSON.stringify(desktop));
            if(!desktop.bodyFont.includes('Inter')||!desktop.titleFont.includes('Oswald')) throw new Error('fonts '+JSON.stringify(desktop));
            if(desktop.structure.tasks!==6||desktop.structure.directions!==5||desktop.structure.timeline!==6||desktop.structure.quotes!==5||desktop.structure.eventSlides!==3) throw new Error('inventory '+JSON.stringify(desktop.structure));
            if(desktop.orbitCount) throw new Error('orbit remains');
            if(desktop.globe.renderer!=='real-continent-blue-noise'||desktop.globe.samples<2500||desktop.globe.samples>4000) throw new Error('globe '+JSON.stringify(desktop.globe));
            if(desktop.map.loaded!==7||desktop.map.paths!==7||desktop.map.worldPaths<10) throw new Error('map '+JSON.stringify(desktop.map));
            if(desktop.nav.join(',')!=='#about,#members,#events') throw new Error('nav '+desktop.nav);
            await page.evaluate(()=>document.querySelector('#events').scrollIntoView({behavior:'auto'}));
            await page.waitForTimeout(300);
            await page.click('[data-event-next]');
            await page.waitForTimeout(160);
            if((await page.evaluate(()=>window.__AXE_STRUCTURE_V3__.getState().eventIndex))!==1) throw new Error('slider failed');
            await page.screenshot({path:'desktop.png',fullPage:true});
            await page.locator('#about').screenshot({path:'about.png'});
            await page.locator('#members').screenshot({path:'map.png'});
            await page.locator('#events').screenshot({path:'events.png'});
            await page.setViewportSize({width:390,height:844});
            await page.reload({waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>window.__AXE_PRELOADER__?.getState().hidden===true,null,{timeout:16000});
            await page.waitForFunction(()=>window.__AXE_COUNTRIES_MAP__?.getState().ready===true,null,{timeout:20000});
            await page.waitForTimeout(500);
            const mobile=await page.evaluate(()=>({sw:document.documentElement.scrollWidth,vw:innerWidth,menu:getComputedStyle(document.querySelector('.menu-toggle')).display}));
            if(mobile.sw>mobile.vw+2||mobile.menu==='none') throw new Error('mobile '+JSON.stringify(mobile));
            await page.screenshot({path:'mobile.png',fullPage:true});
            if(errors.length) throw new Error(errors.join('\n'));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: structure-dark-v3-pr-qa
          path: |
            desktop.png
            about.png
            map.png
            events.png
            mobile.png
          retention-days: 2
