name: Wire final preview entrypoint

on:
  push:
    branches:
      - feat/structure-dark-map-v3
    paths:
      - '.github/workflows/apply-final-entrypoint.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/structure-dark-map-v3
          fetch-depth: 0

      - name: Add final CSS and JS entrypoints
        run: |
          python3 -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(encoding='utf-8'); css='<link rel=\"stylesheet\" href=\"assets/css/figma-v6-final.css?v=2026-08-27\">'; js='<script src=\"assets/js/figma-v5-final.js?v=2026-08-27\"></script>'; anchor='<link rel=\"stylesheet\" href=\"assets/css/figma-v4.css?v=2026-08-25\">'; script='<script src=\"assets/js/figma-v4.js?v=2026-08-25\"></script>'; s=s if css in s else s.replace(anchor, anchor+'\\n  '+css); s=s if js in s else s.replace(script, script+'\\n  '+js); p.write_text(s, encoding='utf-8')"

      - name: Remove temporary workflows and commit
        run: |
          git rm -f .github/workflows/fetch-figma-map-assets.yml .github/workflows/finalize-preview.yml .github/workflows/apply-final-entrypoint.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/js/figma-v5-final.js assets/css/figma-v6-final.css
          git commit -m 'fix: wire final Figma preview layer'
          git push origin HEAD:feat/structure-dark-map-v3
