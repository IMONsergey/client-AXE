<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eef4f7">
  <title>Новая заявка</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="trade-requests.css?v=2026-08-25">
</head>
<body class="tr-page tr-page--app">
  <header class="tr-header tr-header--compact"><div class="tr-container tr-header__inner">
    <a class="tr-brand" href="../"><img src="../assets/images/logo-ace.svg" alt=""><img src="../assets/images/logo-caption.svg" alt=""></a>
    <span class="tr-language"><b>RU</b><i>|</i><span>EN</span></span>
    <a class="tr-logout" href="./"><img src="../assets/images/document-arrow.svg" alt="">Выйти</a>
  </div></header>
  <main class="tr-workspace">
    <div class="tr-container">
      <div class="workspace-head"><h1>Новая заявка</h1><a class="tr-cancel" href="app.html">Отменить</a></div>
      <form class="request-form" data-request-form>
        <fieldset><legend>Основные параметры</legend><div class="request-form__grid request-form__grid--four">
          <label>Дата заявки <b>*</b><input name="date" required placeholder="дд.мм.гггг"></label>
          <label>Тип заявки <b>*</b><select name="type" required><option>Покупка</option><option>Продажа</option></select></label>
          <label>Участник (Биржа-участник) <b>*</b><input name="participant" required placeholder="Название биржи-участника"></label>
          <label>Статус заявки <b>*</b><select name="status" required><option>Активна</option><option>Исполнена</option><option>Отменена</option></select></label>
        </div></fieldset>
        <fieldset><legend>Спецификация товара и объемы</legend><div class="request-form__grid request-form__grid--three">
          <label>Товар <b>*</b><textarea name="product" required placeholder="Описание товара в произвольном формате"></textarea></label>
          <label>Объём <b>*</b><textarea name="volume" required placeholder="Например: 1000 тонн, мин. партия 100 тонн"></textarea></label>
          <label>Цена и условия оплаты <b>*</b><textarea name="price" required placeholder="Цена за единицу, валюта, условия оплаты"></textarea></label>
        </div></fieldset>
        <fieldset><legend>Логистика и доставка</legend><div class="request-form__grid">
          <label>Условия поставки <b>*</b><textarea name="delivery" required placeholder="Бизнес поставки, способ доставки"></textarea></label>
        </div></fieldset>
        <div class="request-form__actions"><button class="tr-button" type="submit">Опубликовать заявку</button><a class="tr-button tr-button--secondary" href="app.html">Отменить</a></div>
      </form>
    </div>
  </main>
  <script src="trade-requests.js?v=2026-08-25"></script>
</body>
</html>
